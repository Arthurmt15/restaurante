services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurante-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - db-data:/app/prisma
    environment:
      - PORT=3001
      - JWT_SECRET=TROQUE_ESTA_CHAVE_SECRETA_EM_PRODUCAO_USE_OPENSSL_RAND_BASE64_32
      - FRONTEND_URL=http://localhost:3000
      - DATABASE_URL=mongodb://mongodb:27017/restaurante?authSource=admin
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - mongodb
    networks:
      - frontend-net
      - backend-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
    container_name: restaurante-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
      - API_URL=http://backend:3001
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-net

  mongodb:
    image: mongo:7
    container_name: restaurante-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  mongo-setup:
    image: mongo:7
    depends_on:
      - mongodb
    command: >
      bash -c "sleep 5; mongosh --host mongodb:27017 --eval 'rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongodb:27017\"}]})' || true"
    networks:
      - backend-net

networks:
  frontend-net:
  backend-net:

volumes:
  db-data:
  mongodb-data:
